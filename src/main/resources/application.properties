spring.application.name=fruitmachine

# Reject JSON fields we don't recognise. Optional fields fall back to defaults, so without this a typo such as
# "slotCnt" would silently be ignored and the caller would get the default machine.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Expose metrics alongside the default health/info endpoints, so fruitmachine.plays and
# fruitmachine.payouts can be read at /actuator/metrics/{name}.
management.endpoints.web.exposure.include=health,info,metrics
